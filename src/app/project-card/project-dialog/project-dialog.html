<header class="flex items-center justify-between gap-4 border-b border-gray-200 py-2 pr-3 pl-6">
  <h2 class="text-2xl font-bold text-gray-900" mat-dialog-title>{{ data.title }}</h2>
  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="'portfolio.close' | translate"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>
</header>

<div mat-dialog-content class="dialog-content">
  <app-carousel [images]="data.pictures" [alt]="data.title" />

  <section class="mt-6">
    <h3 class="text-xs font-semibold tracking-wide text-gray-500 uppercase">
      {{ 'portfolio.description' | translate }}
    </h3>
    <p class="mt-2 leading-relaxed text-gray-700">{{ data.description }}</p>
  </section>

  <div class="mt-5 flex flex-wrap gap-2">
    @for (tag of data.tags; track tag) {
      <span class="rounded-full px-3 py-1 text-sm font-semibold ring-1" [class]="tag.classes">
        {{ tag.toString() }}
      </span>
    }
  </div>
</div>

@if (data.projectUrl) {
  <div mat-dialog-actions align="end" class="border-t border-gray-200 !px-6">
    <a
      class="inline-flex items-center gap-1.5 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700"
      [href]="data.projectUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ 'portfolio.viewProject' | translate }}
      <mat-icon class="!h-4 !w-4 !text-base !leading-none" aria-hidden="true">open_in_new</mat-icon>
    </a>
  </div>
}
