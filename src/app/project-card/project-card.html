@let p = project();
<article
  class="group flex h-full flex-col overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:border-blue-300 hover:shadow-md"
>
  @if (p.pictures.length) {
    <div class="aspect-video overflow-hidden bg-gray-100">
      <img
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
        [src]="p.pictures[0]"
        [alt]="p.title"
        loading="lazy"
      />
    </div>
  }

  <div class="flex flex-1 flex-col p-5">
    <h2 class="text-lg font-bold text-gray-900">{{ p.title }}</h2>
    <p class="mt-2 flex-1 text-sm text-gray-600">{{ p.summary }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
      @for (tag of p.tags; track tag) {
        <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1" [class]="tag.classes">
          {{ tag.toString() }}
        </span>
      }
    </div>

    <button
      type="button"
      class="mt-5 inline-flex cursor-pointer items-center gap-1 self-start text-sm font-semibold text-blue-600 hover:text-blue-700 focus-visible:underline"
      (click)="openDialog()"
    >
      {{ 'portfolio.readMore' | translate }}
      <mat-icon class="!h-4 !w-4 !text-base !leading-none translate-y-px transition group-hover:translate-x-0.5" aria-hidden="true">
        arrow_forward
      </mat-icon>
    </button>
  </div>
</article>
