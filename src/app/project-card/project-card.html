<div class="flex h-full flex-col overflow-hidden rounded shadow-[0_0_12px_rgba(0,0,0,0.15)]">
  <div class="px-6 py-4">
    <div class="font-bold text-xl mb-2 text-center">{{project?.title}}</div>
    <p class="text-gray-700 text-base text-center">{{project?.summary}}</p>
    <div class="text-center cursor-pointer" (click)="openDialog()">
      <a
        
        class="mt-4 inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-blue-500 px-4 py-2.5 text-sm font-medium text-white shadow-xs hover:bg-blue-600 focus:ring-4 focus:ring-gray-200 focus:outline-none"
      >
        Read more
        <svg class="h-4 w-4" aria-hidden="true" fill="none" viewBox="0 0 24 24">
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4"
          />
        </svg>
      </a>
    </div>
  </div>
  <div class="mt-auto px-6 pt-4 pb-2">
    @for (tag of project?.tags; track tag) {
        <span class="inline-block bg-gray-100 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#{{tag.toString()}}</span>
    }
  </div>  
</div>
