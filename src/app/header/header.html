<header class="sticky top-0 z-50 border-b border-gray-200/70 bg-white/80 backdrop-blur-md">
  <div class="relative mx-auto flex h-16 max-w-5xl items-center justify-between gap-4 px-4">
    <a class="flex items-center gap-3" routerLink="/home">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-blue-500 to-blue-700 text-sm font-bold text-white shadow-sm"
        aria-hidden="true"
      >
        CP
      </span>
      <span class="flex flex-col leading-tight">
        <span class="font-bold text-gray-900">Célio Pimentel</span>
        <span class="text-xs text-gray-500">{{ 'header.role' | translate }}</span>
      </span>
    </a>

    <div class="flex items-center gap-2">
      <app-nav />

      <div
        class="flex rounded-full border border-gray-200 bg-gray-50 p-0.5 text-xs font-semibold"
        role="group"
        [attr.aria-label]="'header.language' | translate"
      >
        @for (lang of languages; track lang.code) {
          @let active = language.current() === lang.code;
          <button
            type="button"
            class="cursor-pointer rounded-full px-2.5 py-1 transition"
            [class]="active ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-900'"
            [attr.aria-pressed]="active"
            [attr.title]="lang.name | translate"
            (click)="setLanguage(lang.code)"
          >
            {{ lang.label }}
          </button>
        }
      </div>
    </div>
  </div>
</header>
