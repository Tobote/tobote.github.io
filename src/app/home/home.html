<div class="grid grid-rows-1 grid-cols-2 gap-4">
  <!--About me-->
  <div class="col-lg shadow-md border border-gray-200 m-1 p-5">
    <div class="flex flex-col items-center text-center">
      <h2 class="font-sans text-2xl font-semibold mb-4">{{ 'home.about.heading' | translate }}</h2>
      <img
        class="mx-auto w-50 h-50 rounded-full object-cover"
        src="/assets/img/eu.jpg"
        [alt]="'home.about.imageAlt' | translate"
        width="256"
        height="256"
      />
      <p class="pt-5">{{ 'home.about.biography' | translate }}</p>
    </div>
  </div>
  <!--Featured project-->
  <div class="col-lg shadow-md border border-gray-200 m-1 p-5">
    <div class="place-content-center text-center">
      <h2 class="font-sans text-2xl font-semibold mb-2">
        {{ 'home.featuredProject.heading' | translate }}        
      </h2>
      <h4 class="font-sans mb-4">{{ featuredProject?.title }}</h4>
    </div>

    <app-carousel
      class="mx-auto block w-full max-w-md"
      [images]="featuredProject?.pictures ?? []"
      [alt]="(featuredProject?.title ?? 'Featured project') + ' images'"
    />
    <p class="pt-5">{{ featuredProject?.summary }}</p>
    <p class="pt-5">Visit the Portfolio section to learn more!</p>
  </div>
</div>
