@let group = skillGroup();
<div class="h-full rounded-lg border border-gray-200 bg-white p-4 text-left">
  <h3 class="flex items-center gap-2 text-base font-bold text-gray-900">
    <span class="h-2 w-2 rounded-full bg-blue-500" aria-hidden="true"></span>
    {{ group.category }}
  </h3>
  <div class="mt-3 flex flex-wrap gap-2">
    @for (item of group.items; track item) {
      <span class="rounded-full bg-gray-100 px-3 py-1 text-sm font-semibold text-gray-700">
        {{ item }}
      </span>
    }
  </div>
</div>
