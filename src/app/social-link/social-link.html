@let link = socialLink();
<a
  class="group flex flex-col items-center gap-2"
  [href]="link.url"
  target="_blank"
  rel="noopener"
  [attr.aria-label]="link.name"
>
  <span
    class="flex h-14 w-14 items-center justify-center rounded-full bg-blue-50 text-blue-600 shadow-sm transition group-hover:-translate-y-0.5 group-hover:bg-blue-600 group-hover:text-white group-hover:shadow-md"
  >
    <mat-icon [svgIcon]="link.icon" aria-hidden="true"></mat-icon>
  </span>
  <span class="text-sm font-medium text-gray-700 group-hover:text-blue-600">{{ link.name }}</span>
</a>
