@let item = contactItem();
<div
  class="flex h-full items-center gap-4 rounded-lg border border-gray-200 bg-white p-5 text-left shadow-sm transition hover:border-blue-300 hover:shadow-md"
>
  <span
    class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-600"
  >
    <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
  </span>

  <div class="min-w-0 flex-1">
    <p class="text-xs font-semibold tracking-wide text-gray-500 uppercase">{{ item.label }}</p>
    @if (item.url) {
      <a
        class="block truncate font-medium text-gray-900 hover:text-blue-600"
        [href]="item.url"
        [attr.target]="isExternal() ? '_blank' : null"
        [attr.rel]="isExternal() ? 'noopener' : null"
      >
        {{ item.value }}
      </a>
    } @else {
      <p class="truncate font-medium text-gray-900">{{ item.value }}</p>
    }
  </div>

  @if (item.copyable) {
    <button
      type="button"
      class="shrink-0 cursor-pointer rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100"
      (click)="copy()"
    >
      {{ (copied() ? 'contact.copied' : 'contact.copy') | translate }}
    </button>
  }
</div>
